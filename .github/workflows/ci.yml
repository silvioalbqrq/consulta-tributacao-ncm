name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dados:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Regressão da base
        run: python scripts/test_dados.py
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Sintaxe do front-end
        run: node --check assets/app.js
      - name: Regressão do front-end
        run: node scripts/test_front.mjs
