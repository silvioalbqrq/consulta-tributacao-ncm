name: CI

on:
  push:
  pull_request:

jobs:
  dados:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Regressão da base
        run: python scripts/test_dados.py
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Sintaxe do front-end
        run: node --check assets/app.js
